name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Self-audit this runner (informational, not gated)
        # A hosted CI runner is not a hardened server and will legitimately
        # fail plenty of these checks (no auditd, no host firewall, etc.) -
        # this step exists to prove the tool runs end-to-end on a fresh
        # environment, not to enforce a compliance bar on GitHub's runners.
        run: python -m cis_audit run --format text || true
